<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTVK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryTVK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bgTVK)" />

  <!-- App Title Bar in Workspace -->
  <g transform="translate(30, 20)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">TVK Perambur Branch &bull; Figma Mobile UI/UX Prototype</text>
    <text y="18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Screen: Member Portal &amp; Community Event Feed</text>
  </g>

  <!-- Mobile Phone Mockup 1 (Main Feed) -->
  <g transform="translate(190, 50)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect width="220" height="310" rx="28" fill="#090d16" stroke="#334155" stroke-width="3" />
    <!-- Screen -->
    <rect x="8" y="8" width="204" height="294" rx="20" fill="#0f172a" />
    
    <!-- Notch / Dynamic Island -->
    <rect x="75" y="14" width="70" height="14" rx="7" fill="#000000" />
    <circle cx="130" cy="21" r="2.5" fill="#38bdf8" />

    <!-- App Header -->
    <rect x="18" y="38" width="184" height="36" rx="8" fill="url(#primaryTVK)" />
    <text x="30" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">TVK PERAMBUR</text>
    <circle cx="185" cy="56" r="8" fill="rgba(255,255,255,0.2)" />

    <!-- Search Bar -->
    <rect x="18" y="84" width="184" height="22" rx="6" fill="#1e293b" />
    <text x="28" y="99" font-family="sans-serif" font-size="9" fill="#64748b">🔍 Search events &amp; updates...</text>

    <!-- Featured Community Card -->
    <rect x="18" y="114" width="184" height="68" rx="8" fill="#1e1e38" stroke="#8b5cf6" stroke-width="1" />
    <rect x="26" y="122" width="40" height="40" rx="6" fill="#8b5cf6" opacity="0.3" />
    <path d="M 38,135 L 46,145 L 54,135" fill="none" stroke="#a78bfa" stroke-width="2" />
    <text x="74" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Branch Meetup 2026</text>
    <text x="74" y="147" font-family="sans-serif" font-size="8" fill="#94a3b8">Perambur Hall &bull; 10:00 AM</text>
    <rect x="74" y="154" width="56" height="16" rx="4" fill="#8b5cf6" />
    <text x="85" y="165" font-family="sans-serif" font-size="8" font-weight="600" fill="#ffffff">Register</text>

    <!-- Recent Feeds -->
    <rect x="18" y="190" width="184" height="44" rx="8" fill="#1e293b" />
    <circle cx="34" cy="212" r="10" fill="#3b82f6" />
    <text x="52" y="208" font-family="sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">Volunteer Campaign</text>
    <text x="52" y="222" font-family="sans-serif" font-size="7.5" fill="#64748b">Community drive registration active</text>

    <rect x="18" y="240" width="184" height="40" rx="8" fill="#1e293b" />
    <circle cx="34" cy="260" r="10" fill="#10b981" />
    <text x="52" y="256" font-family="sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">Announcements</text>
    <text x="52" y="270" font-family="sans-serif" font-size="7.5" fill="#64748b">Youth initiative updates &amp; polls</text>

    <!-- Bottom Navigation Bar -->
    <rect x="8" y="276" width="204" height="26" fill="#090d16" />
    <circle cx="40" cy="289" r="4" fill="#a855f7" />
    <circle cx="85" cy="289" r="4" fill="#475569" />
    <circle cx="130" cy="289" r="4" fill="#475569" />
    <circle cx="175" cy="289" r="4" fill="#475569" />
  </g>

  <!-- Side UI Element Mockup (Left - Component Palette) -->
  <g transform="translate(35, 80)">
    <rect width="130" height="260" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="14" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#a855f7">DESIGN SYSTEM</text>
    <rect x="14" y="38" width="102" height="18" rx="4" fill="#8b5cf6" />
    <text x="24" y="50" font-family="sans-serif" font-size="8" fill="#fff">Primary Button</text>
    <rect x="14" y="64" width="102" height="18" rx="4" fill="none" stroke="#64748b" stroke-width="1" />
    <text x="24" y="76" font-family="sans-serif" font-size="8" fill="#cbd5e1">Outline Button</text>
    <text x="14" y="105" font-family="sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Typography Scale</text>
    <text x="14" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#f8fafc">Heading 1</text>
    <text x="14" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Subheading</text>
    <text x="14" y="157" font-family="sans-serif" font-size="9" fill="#64748b">Regular Body Copy</text>
    <text x="14" y="190" font-family="sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Color Tokens</text>
    <circle cx="22" cy="210" r="7" fill="#8b5cf6" />
    <circle cx="42" cy="210" r="7" fill="#3b82f6" />
    <circle cx="62" cy="210" r="7" fill="#10b981" />
    <circle cx="82" cy="210" r="7" fill="#f59e0b" />
    <circle cx="102" cy="210" r="7" fill="#ec4899" />
  </g>

  <!-- Side UI Element Mockup (Right - Interaction Flows) -->
  <g transform="translate(435, 80)">
    <rect width="130" height="260" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="14" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">USER FLOWS</text>
    <rect x="14" y="42" width="102" height="34" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="22" y="58" font-family="sans-serif" font-size="8" font-weight="600" fill="#e2e8f0">Splash &amp; Login</text>
    <text x="22" y="69" font-family="sans-serif" font-size="7" fill="#94a3b8">Auth verification</text>
    
    <path d="M 65,76 L 65,96" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
    
    <rect x="14" y="98" width="102" height="34" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="22" y="114" font-family="sans-serif" font-size="8" font-weight="600" fill="#e2e8f0">Home Dashboard</text>
    <text x="22" y="125" font-family="sans-serif" font-size="7" fill="#94a3b8">Event Feed &amp; Notices</text>

    <path d="M 65,132 L 65,152" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3" />

    <rect x="14" y="154" width="102" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="22" y="170" font-family="sans-serif" font-size="8" font-weight="600" fill="#e2e8f0">Community Hub</text>
    <text x="22" y="181" font-family="sans-serif" font-size="7" fill="#94a3b8">Membership &amp; Polls</text>
  </g>
</svg>
