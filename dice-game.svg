<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3944f7" />
      <stop offset="100%" stop-color="#2b32b2" />
    </linearGradient>
    <filter id="diceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="#0d1117" />

  <!-- App Window -->
  <g transform="translate(25, 20)">
    <rect width="550" height="340" rx="12" fill="url(#bgDice)" stroke="#4f46e5" stroke-width="2" />
    
    <!-- Game Window Title Bar -->
    <rect width="550" height="40" rx="12" fill="rgba(0,0,0,0.2)" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="35" cy="20" r="5" fill="#f59e0b" />
    <circle cx="50" cy="20" r="5" fill="#10b981" />
    <text x="75" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff">🎲 The Roll Challenge &bull; JavaScript DOM Interactive Game</text>

    <!-- Winner Headline Banner -->
    <g transform="translate(100, 60)">
      <rect width="350" height="46" rx="23" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="1.5" />
      <text x="175" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">🚩 Player 1 Wins!</text>
    </g>

    <!-- Dice Arenas -->
    <g transform="translate(40, 125)">
      <!-- Player 1 Arena -->
      <g transform="translate(50, 0)">
        <text x="60" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Player 1</text>
        
        <!-- Die Face: 6 -->
        <g transform="translate(0, 35)" filter="url(#diceShadow)">
          <rect width="120" height="120" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
          <!-- Dots for 6 -->
          <circle cx="35" cy="30" r="9" fill="#ef4444" />
          <circle cx="35" cy="60" r="9" fill="#ef4444" />
          <circle cx="35" cy="90" r="9" fill="#ef4444" />
          <circle cx="85" cy="30" r="9" fill="#ef4444" />
          <circle cx="85" cy="60" r="9" fill="#ef4444" />
          <circle cx="85" cy="90" r="9" fill="#ef4444" />
        </g>
        <text x="60" y="180" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">Score: 6</text>
      </g>

      <!-- Versus Divider -->
      <g transform="translate(235, 80)">
        <circle cx="0" cy="0" r="22" fill="rgba(0,0,0,0.3)" />
        <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">VS</text>
      </g>

      <!-- Player 2 Arena -->
      <g transform="translate(290, 0)">
        <text x="60" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Player 2</text>
        
        <!-- Die Face: 3 -->
        <g transform="translate(0, 35)" filter="url(#diceShadow)">
          <rect width="120" height="120" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
          <!-- Dots for 3 -->
          <circle cx="30" cy="30" r="9" fill="#1e293b" />
          <circle cx="60" cy="60" r="9" fill="#1e293b" />
          <circle cx="90" cy="90" r="9" fill="#1e293b" />
        </g>
        <text x="60" y="180" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">Score: 3</text>
      </g>
    </g>

    <!-- Action Button (Roll Dice) -->
    <g transform="translate(200, 275)">
      <rect width="150" height="40" rx="20" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
      <text x="75" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">🎲 ROLL DICE</text>
    </g>
  </g>
</svg>
