<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTinDog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#ff7556" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="#111827" />

  <!-- App Window -->
  <g transform="translate(25, 20)">
    <rect width="550" height="340" rx="12" fill="#ff4b4b" stroke="#f43f5e" stroke-width="2" />
    
    <!-- TinDog Nav -->
    <rect width="550" height="42" rx="12" fill="rgba(0,0,0,0.15)" />
    <circle cx="20" cy="21" r="5" fill="#ffffff" opacity="0.8" />
    <circle cx="35" cy="21" r="5" fill="#ffffff" opacity="0.6" />
    <circle cx="50" cy="21" r="5" fill="#ffffff" opacity="0.4" />
    <text x="75" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff">🐾 tindog</text>
    
    <text x="360" y="26" font-family="sans-serif" font-size="10" fill="#ffffff">Contact</text>
    <text x="415" y="26" font-family="sans-serif" font-size="10" fill="#ffffff">Pricing</text>
    <text x="465" y="26" font-family="sans-serif" font-size="10" fill="#ffffff">Download</text>

    <!-- Hero Content -->
    <g transform="translate(25, 60)">
      <!-- Left Column: Title & CTAs -->
      <g>
        <text x="0" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Meet new and</text>
        <text x="0" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#ffffff">interesting dogs</text>
        <text x="0" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#ffffff">nearby.</text>
        
        <text x="0" y="125" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">The modern social matchmaking platform engineered for pets.</text>

        <!-- Store Buttons -->
        <g transform="translate(0, 145)">
          <!-- App Store -->
          <rect width="115" height="34" rx="6" fill="#111827" />
          <text x="14" y="21" font-size="13">🍏</text>
          <text x="35" y="16" font-family="sans-serif" font-size="7" fill="#94a3b8">Download on the</text>
          <text x="35" y="27" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">App Store</text>

          <!-- Google Play -->
          <rect x="125" width="115" height="34" rx="6" fill="#111827" />
          <text x="139" y="21" font-size="13">▶️</text>
          <text x="160" y="16" font-family="sans-serif" font-size="7" fill="#94a3b8">GET IT ON</text>
          <text x="160" y="27" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">Google Play</text>
        </g>
      </g>

      <!-- Right Column: Phone Mockup with Dog Profile -->
      <g transform="translate(300, 5)">
        <!-- Phone Outline -->
        <rect width="180" height="235" rx="20" fill="#111827" stroke="#ffffff" stroke-width="2" />
        <rect x="6" y="6" width="168" height="223" rx="16" fill="#ffffff" />
        
        <!-- Profile Card inside Phone -->
        <g transform="translate(14, 15)">
          <rect width="152" height="150" rx="10" fill="#fed7aa" />
          <circle cx="76" cy="65" r="35" fill="#f97316" />
          <text x="56" y="75" font-size="34">🐕</text>
          <!-- Dog Name & Age -->
          <rect x="8" y="112" width="136" height="30" rx="6" fill="rgba(0,0,0,0.6)" />
          <text x="18" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff">Buddy, 2</text>
          <text x="18" y="138" font-family="sans-serif" font-size="8" fill="#cbd5e1">Golden Retriever &bull; 2.5 km away</text>
        </g>

        <!-- Swipe Action Buttons -->
        <g transform="translate(35, 180)">
          <!-- Dislike Button -->
          <circle cx="25" cy="18" r="18" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
          <text x="18" y="24" font-size="15">❌</text>
          <!-- Like Button -->
          <circle cx="85" cy="18" r="18" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
          <text x="77" y="24" font-size="15">💚</text>
        </g>
      </g>
    </g>

    <!-- Features Strip -->
    <g transform="translate(0, 275)">
      <rect width="550" height="65" fill="#ffffff" rx="0" />
      <g transform="translate(30, 20)">
        <text x="0" y="15" font-size="16">🎯</text>
        <text x="25" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0f172a">Easy to Use</text>
        <text x="25" y="24" font-family="sans-serif" font-size="8" fill="#64748b">Instant matchmaking for pets</text>

        <text x="180" y="15" font-size="16">👑</text>
        <text x="205" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0f172a">Elite Clientele</text>
        <text x="205" y="24" font-family="sans-serif" font-size="8" fill="#64748b">Verified breeds &amp; owners</text>

        <text x="360" y="15" font-size="16">❤️</text>
        <text x="385" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0f172a">Guaranteed Fun</text>
        <text x="385" y="24" font-family="sans-serif" font-size="8" fill="#64748b">Community playdates daily</text>
      </g>
    </g>
  </g>
</svg>
