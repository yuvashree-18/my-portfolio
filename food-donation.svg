<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0f2942" />
    </linearGradient>
    <linearGradient id="metricGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="metricGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bgFood)" />

  <!-- App Window Frame -->
  <g transform="translate(25, 20)">
    <!-- Top Bar -->
    <rect width="550" height="340" rx="12" fill="#0b1326" stroke="#1e293b" stroke-width="2" />
    <rect width="550" height="38" rx="12" fill="#0f1a30" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="35" cy="19" r="5" fill="#f59e0b" />
    <circle cx="50" cy="19" r="5" fill="#10b981" />
    <text x="75" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Food Redistribution &amp; AI Donation Tracker &bull; Operations Dashboard</text>
    <rect x="420" y="9" width="115" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
    <text x="430" y="23" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">● AI Camera Active</text>

    <!-- Sidebar -->
    <g transform="translate(15, 50)">
      <rect width="110" height="275" rx="8" fill="#0d162a" />
      <text x="12" y="24" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b">PORTAL MENU</text>
      <rect x="8" y="34" width="94" height="24" rx="4" fill="#1e293b" />
      <text x="18" y="50" font-family="sans-serif" font-size="9" font-weight="600" fill="#38bdf8">📊 Dashboard</text>
      <text x="18" y="80" font-family="sans-serif" font-size="9" fill="#94a3b8">🍲 Donations</text>
      <text x="18" y="106" font-family="sans-serif" font-size="9" fill="#94a3b8">🤖 AI Verification</text>
      <text x="18" y="132" font-family="sans-serif" font-size="9" fill="#94a3b8">🚚 Distribution</text>
      <text x="18" y="158" font-family="sans-serif" font-size="9" fill="#94a3b8">📈 Impact Stats</text>
      <text x="18" y="184" font-family="sans-serif" font-size="9" fill="#94a3b8">⚙️ Settings</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(140, 50)">
      <!-- KPI Stats Row -->
      <g>
        <!-- Metric 1 -->
        <rect x="0" y="0" width="125" height="60" rx="8" fill="#111c33" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="18" font-family="sans-serif" font-size="8" fill="#94a3b8">TOTAL SURPLUS LOGGED</text>
        <text x="12" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#34d399">1,240 kg</text>

        <!-- Metric 2 -->
        <rect x="135" y="0" width="125" height="60" rx="8" fill="#111c33" stroke="#1e293b" stroke-width="1" />
        <text x="147" y="18" font-family="sans-serif" font-size="8" fill="#94a3b8">ACTIVE DISPATCHES</text>
        <text x="147" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#38bdf8">18 Units</text>

        <!-- Metric 3 -->
        <rect x="270" y="0" width="125" height="60" rx="8" fill="#111c33" stroke="#1e293b" stroke-width="1" />
        <text x="282" y="18" font-family="sans-serif" font-size="8" fill="#94a3b8">VERIFIED QUALITY</text>
        <text x="282" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#a78bfa">99.4%</text>
      </g>

      <!-- Live Tracking & AI Vision Feed Panel -->
      <g transform="translate(0, 72)">
        <rect width="250" height="203" rx="8" fill="#111c33" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Live Food Quality Feed &bull; OpenCV</text>
        <!-- Simulated OpenCV Camera Frame -->
        <rect x="14" y="32" width="222" height="110" rx="6" fill="#090e1c" stroke="#334155" stroke-width="1" />
        <!-- Bounding Box Overlay -->
        <rect x="40" y="45" width="80" height="60" rx="4" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" />
        <text x="42" y="42" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34d399">Surplus Item: Grade A (0.97)</text>
        <rect x="135" y="55" width="70" height="50" rx="4" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2" />
        <text x="137" y="52" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">Packaged Cans (0.94)</text>
        
        <!-- Live Status Bar -->
        <rect x="14" y="152" width="222" height="40" rx="6" fill="#0d1527" />
        <text x="22" y="167" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">AI Model: Freshness Detection &bull; PyTorch/OpenCV</text>
        <text x="22" y="182" font-family="sans-serif" font-size="8" fill="#64748b">Latency: 42ms &bull; Status: Ready for Automated Allocation</text>
      </g>

      <!-- Real-Time Dispatches Column -->
      <g transform="translate(260, 72)">
        <rect width="135" height="203" rx="8" fill="#111c33" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f1f5f9">Recent Dispatches</text>

        <!-- Dispatch 1 -->
        <rect x="8" y="32" width="119" height="50" rx="6" fill="#0e172a" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
        <text x="14" y="46" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#f8fafc">Chennai Center #4</text>
        <text x="14" y="58" font-family="sans-serif" font-size="7.5" fill="#94a3b8">120 Meals &bull; Node.js API</text>
        <text x="14" y="72" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#34d399">Delivered 10:15</text>

        <!-- Dispatch 2 -->
        <rect x="8" y="88" width="119" height="50" rx="6" fill="#0e172a" stroke="rgba(59,130,246,0.3)" stroke-width="1" />
        <text x="14" y="102" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#f8fafc">Ambattur Shelter</text>
        <text x="14" y="114" font-family="sans-serif" font-size="7.5" fill="#94a3b8">85 Meals &bull; In Transit</text>
        <text x="14" y="128" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#38bdf8">ETA: 12 Mins</text>

        <!-- Dispatch 3 -->
        <rect x="8" y="144" width="119" height="50" rx="6" fill="#0e172a" />
        <text x="14" y="158" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#f8fafc">Community Kitchen</text>
        <text x="14" y="170" font-family="sans-serif" font-size="7.5" fill="#94a3b8">210 kg Dry Grains</text>
        <text x="14" y="184" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#a78bfa">Assigned</text>
      </g>
    </g>
  </g>
</svg>
